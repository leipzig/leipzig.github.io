highlights:
- Technical product manager for TileDB's population-genomics line, including TileDB-VCF
- Supports 5 major biopharma and hospital customers; involved in the sales process for 30+ prospects
- Primary industry partner contact for the BeginNGS pediatric newborn screening consortium
- Helped four diagnostic, therapeutic, and SaaS startups define and implement their product strategy
- 25+ years bridging genomics R&D and enterprise software
- BS in Biology, MS in Computer Science, PhD in Information Science
- 40+ peer-reviewed publications, h-index of 30; author of O'Reilly's Data Mashups in R
- Founder of the PhillyR user community
full_bio: |
  Technical product manager for TileDB's population-genomics line and a bioinformatics leader with 25+ years bridging genomics R&D and enterprise software. I develop scalable genomics data products from concept through launch, translating genetics research and discovery workflows into enterprise-grade platforms used by pharma and biotech partners, owning product vision, roadmaps, and success metrics while partnering across science, engineering, and business.

  I have helped four diagnostic, therapeutic, and SaaS startups define and implement their product strategy, bridging cutting-edge research and practical commercial applications. My expertise spans low-level algorithm development through high-level product strategy and customer engagement.

  As a researcher, I have authored over 50 publications with an h-index of 30, contributing to fields including HIV integration site analysis, mitochondrial genetics, reproducible research methodologies, and computational pipeline development. My work has been published in prestigious journals including Cell, Nature, PLoS Computational Biology, and Genome Research.

  I am passionate about community building and knowledge sharing, having founded the PhillyR user group and maintaining a top-20 ranking on biostars.org. My commitment to open science and reproducible research has led to the development of multiple open source tools and frameworks that are widely used in the bioinformatics community.

  Currently serving as Product Manager at TileDB, I manage the population genomics product line, working directly with biopharma and hospital partners to develop scalable analysis workflows. My unique combination of deep technical expertise, research experience, and business acumen allows me to translate complex computational challenges into successful product solutions.
research_interests:
- title: Reproducible Research & Metadata
  description: Developing frameworks and tools to ensure computational reproducibility in biological research, with focus on metadata standards and pipeline documentation
- title: Genomic Variant Analysis
  description: Creating tools for mitochondrial genetics, exome analysis, and clinical genomics applications with emphasis on rare disease diagnostics
- title: Cloud-Scale Bioinformatics
  description: Building scalable workflows and platforms for population genomics, drug discovery, and precision medicine using AWS and GCP infrastructure
- title: Bioinformatics Product Strategy
  description: Translating research methodologies into commercial bioinformatics products, from startup strategy to enterprise solutions
